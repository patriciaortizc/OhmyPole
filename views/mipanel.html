<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Mi panel | Oh my Pole</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="../index.html" class="ohmypole-logo">
                <img src="../assets/images/ohmypole-logo.png" alt="Oh my pole">
            </a>
            <ul class="menu">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="quienessomos.html">Quiénes somos</a></li>
                <li><a href="poledance.html">Pole dance</a></li>
                <li><a href="poleexotic.html">Pole exotic</a></li>
                <li><a href="polekids.html">Pole kids</a></li>
                <li><a href="aereos.html">Aéreos</a></li>
                <li><a href="tarifas.html">Tarifas</a></li>
            </ul>
            <button class="acceder" onclick="window.location.href='acceder.html'">Acceder</button>
            <button class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <main>
        <div class="panel-container">
            <div class="panel-header">
                <h2>Hola, <span id="nombre-usuario"></span> 👋</h2>
                <div style="display:flex;gap:12px;">
                    <button id="btn-admin" class="btn-salir" style="display:none;" onclick="window.location.href='adminpanel.html'">Panel Admin</button>
                    <button class="btn-salir" onclick="cerrarSesion()">Cerrar sesión</button>
                </div>
            </div>

            <!-- MIS RESERVAS -->
            <div class="reservas-section">
                <h3><i class="fa-regular fa-calendar-check"></i> Mis reservas</h3>
                <div id="lista-reservas">
                    <p class="sin-reservas">Cargando reservas...</p>
                </div>
            </div>

            <!-- HORARIO PARA RESERVAR -->
            <div class="horario-panel">
                <h3><i class="fa-regular fa-calendar"></i> Reservar una clase</h3>
                <div class="dias-grid" id="dias-grid"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>© 2025 ohmypole–Todos los derechos reservados.</p>
            <p>Diseñada con ♡ por Patricia Ortiz</p>
        </div>
    </footer>

    <div class="toast" id="toast"></div>

    <script src="../js/scripts.js"></script>
    <script type="module" src="../js/mipanel.js"></script>
</body>
</html>
