<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/adminpanel.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Admin | Oh my Pole</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="../index.html" class="ohmypole-logo">
                <img src="../assets/images/ohmypole-logo.png" alt="Oh my pole">
            </a>
            <ul class="menu">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="quienessomos.html">Quiénes somos</a></li>
                <li><a href="poledance.html">Pole dance</a></li>
                <li><a href="poleexotic.html">Pole exotic</a></li>
                <li><a href="polekids.html">Pole kids</a></li>
                <li><a href="aereos.html">Aéreos</a></li>
                <li><a href="tarifas.html">Tarifas</a></li>
            </ul>
            <button class="acceder" onclick="window.location.href='acceder.html'">Acceder</button>
            <button class="hamburger" id="hamburger">
                <span></span><span></span><span></span>
            </button>
        </nav>
    </header>

    <main>
        <div class="admin-container">
            <div class="admin-header">
                <h2>Panel de administración</h2>
                <div class="admin-header-btns">
                    <button class="btn-salir" onclick="window.location.href='mipanel.html'">Mi panel</button>
                    <button class="btn-salir" onclick="cerrarSesion()">Cerrar sesión</button>
                </div>
            </div>

            <div id="aviso-container"></div>

            <div class="stats-row">
                <div class="stat-card">
                    <div class="num" id="stat-total">–</div>
                    <div class="label">Alumnas registradas</div>
                </div>
                <div class="stat-card">
                    <div class="num" id="stat-pagadas">–</div>
                    <div class="label">Han pagado este mes</div>
                </div>
                <div class="stat-card">
                    <div class="num" id="stat-pendientes">–</div>
                    <div class="label">Pago pendiente</div>
                </div>
            </div>

            <div class="alumnas-lista" id="alumnas-lista">
                <div class="loading-msg">Cargando alumnas...</div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <footer class="footer">
        <div class="footer-container">
            <p>© 2025 ohmypole–Todos los derechos reservados.</p>
            <p>Diseñada con ♡ por Patricia Ortiz</p>
        </div>
    </footer>

    <script type="module" src="../js/adminpanel.js"></script>
    <script src="../js/scripts.js"></script>
</body>

</html>
