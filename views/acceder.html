<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Acceder | Oh my Pole</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="../index.html" class="ohmypole-logo">
                <img src="../assets/images/ohmypole-logo.png" alt="Oh my pole">
            </a>
            <ul class="menu">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="quienessomos.html">Quiénes somos</a></li>
                <li><a href="poledance.html">Pole dance</a></li>
                <li><a href="poleexotic.html">Pole exotic</a></li>
                <li><a href="polekids.html">Pole kids</a></li>
                <li><a href="aereos.html">Aéreos</a></li>
                <li><a href="tarifas.html">Tarifas</a></li>
            </ul>
            <button class="acceder" onclick="window.location.href='acceder.html'">Acceder</button>
            <button class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <h2>Oh my Pole</h2>
            <p class="subtitle">Accede a tu cuenta para reservar clases</p>

            <div class="tabs">
                <div class="tab active" id="tab-login" onclick="mostrarLogin()">Iniciar sesión</div>
                <div class="tab" id="tab-registro" onclick="mostrarRegistro()">Crear cuenta</div>
            </div>

            <!-- LOGIN -->
            <form id="form-login" onsubmit="login(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-auth">Entrar</button>
                <p class="error-msg" id="login-error"></p>
            </form>

            <!-- REGISTRO -->
            <form id="form-registro" onsubmit="registro(event)">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="reg-nombre" placeholder="Tu nombre" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required>
                </div>
                <button type="submit" class="btn-auth">Crear cuenta</button>
                <p class="error-msg" id="reg-error"></p>
                <p class="success-msg" id="reg-success"></p>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>© 2025 ohmypole–Todos los derechos reservados.</p>
            <p>Diseñada con ♡ por Patricia Ortiz</p>
        </div>
    </footer>
    <script src="../js/scripts.js"></script>
    <script type="module" src="../js/acceder.js"></script>
</body>

</html>
